---
- name: Clone or update course-store repo
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_directory }}"
    version: "{{ app_branch }}"
    update: true
    force: true
  register: repository_result

- name: Display Repository Deployement Result
  ansible.builtin.debug:
    msg: >-
      "Repository {{app_name}} Deployed successfully on {{inventory_hostname}}
       changed: {{repository_result.changed}}"

